    <text x="24" y="35" fill="rgba(255,255,255,0.8)" font-size="11">Hey everyone! The dark mode theme...</text>
    <text x="14" y="62" fill="#ffffff" font-size="13" font-weight="500">Agreed! The WebSocket latency is sub-15ms and the</text>
    <text x="14" y="78" fill="#ffffff" font-size="13" font-weight="500">audio chime sound effects feel super tactile! ⚡</text>
    <text x="360" y="80" fill="rgba(255,255,255,0.8)" font-size="10">10:48 AM ✓✓</text>
